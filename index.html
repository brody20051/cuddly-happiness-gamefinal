<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag Racing Sim</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="styles/game.css">
</head>

<body>

<div class="track"></div>

<header>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">🏁 Drag Racing Sim</span>
      <button id="resetBtn" class="btn btn-danger">Reset</button>
    </div>
  </nav>
</header>

<main class="container text-center mt-4">

  <h2 id="status">Login to Start</h2>

  <!-- LOGIN -->
  <div class="mb-3">
    <input id="username" placeholder="Enter Name" class="form-control w-25 mx-auto">
    <button id="loginBtn" class="btn btn-primary mt-2">Login</button>
  </div>

  <!-- TREE -->
  <div id="tree">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light yellow"></div>
    <div class="light yellow"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
  </div>

  <!-- CONTROLS -->
  <div class="mt-4">
    <button id="startBtn" class="btn btn-success">Start</button>
    <button id="launchBtn" class="btn btn-warning" disabled>Launch</button>
  </div>

  <!-- SCORE -->
  <div class="mt-3">
    <p>Reaction Time: <span id="time">0.000</span></p>
  </div>

  <!-- TRACK -->
  <div class="race-track mt-4">
    <div class="lane">
      <img src="images/car.png" id="playerCar">
    </div>
    <div class="lane">
      <img src="images/car2.png" id="aiCar">
    </div>
    <div class="finish-line"></div>
  </div>

</main>

<script type="module" src="scripts/game.js"></script>

</body>
</html>
